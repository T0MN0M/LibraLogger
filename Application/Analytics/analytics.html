<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics | Libra Logger</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="analytics.css" />
    <script src="../shared/stars.js" defer></script>
    <script src="../shared/api.js" defer></script>
    <script src="../shared/app-shell.js" defer></script>
    <script src="analytics.js" defer></script>
  </head>
  <body>
    <canvas id="stars"></canvas>

    <header class="topbar">
      <a class="topbar-btn logout" href="../Login_Page/login.html" data-logout title="Log out">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span class="label">Logout</span>
      </a>
      <a class="brand" href="../Dashboard/dashboard.html" title="Dashboard">
        <img src="../../Styles/LibraLoggerLogo.png" alt="" />
        Libra <span>Logger</span>
      </a>
      <a class="topbar-btn settings" href="../User_Settings/settings.html" title="Settings">
        <span class="label">Settings</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
      </a>
    </header>

    <main class="page">
      <div class="page-header">
        <h1 class="page-title">Analytics</h1>
        <!-- Filters live in one row above the charts -->
        <div class="segmented" role="group" aria-label="Time range" id="rangeControl">
          <button type="button" data-range="WEEK" aria-pressed="false">This week</button>
          <button type="button" data-range="MONTH" aria-pressed="true">This month</button>
          <button type="button" data-range="90D" aria-pressed="false">Last 90 days</button>
        </div>
      </div>

      <!-- ===== KPI row ===== -->
      <section class="kpis" aria-label="Summary">
        <div class="card kpi"><span class="kpi-label">Total spent</span><span class="kpi-value" id="kpiTotal">–</span></div>
        <div class="card kpi"><span class="kpi-label">Average per day</span><span class="kpi-value" id="kpiAvg">–</span></div>
        <div class="card kpi"><span class="kpi-label">Top category</span><span class="kpi-value" id="kpiTop">–</span></div>
        <div class="card kpi"><span class="kpi-label">Transactions</span><span class="kpi-value" id="kpiCount">–</span></div>
      </section>

      <div class="grid-2">
        <!-- ===== Line: cumulative spending ===== -->
        <section class="card" aria-labelledby="lineTitle">
          <h2 class="card-title" id="lineTitle">Cumulative spending</h2>
          <div class="chart" id="lineChart"></div>
          <details class="table-view">
            <summary>View as table</summary>
            <table id="lineTable"></table>
          </details>
        </section>

        <!-- ===== Ranked bars: by category ===== -->
        <section class="card" aria-labelledby="barTitle">
          <h2 class="card-title" id="barTitle">Spending by category</h2>
          <ol class="bars" id="categoryBars"></ol>
        </section>
      </div>

      <!-- ===== Goals (Budget.set_Budget / adjust_Threshold) ===== -->
      <section class="card goals" id="goals" aria-labelledby="goalsTitle">
        <h2 class="card-title" id="goalsTitle">Budget Goal</h2>
        <div class="goals-layout">
          <form id="goalForm" class="form-grid" novalidate>
            <label class="form-field">
              Period
              <select class="input" name="period">
                <option value="MONTHLY">Monthly</option>
                <option value="WEEKLY">Weekly</option>
              </select>
            </label>
            <label class="form-field">
              Spending limit ($)
              <input class="input" type="number" name="limit_amount" min="1" step="1" required />
            </label>
            <label class="form-field">
              Alert me at (% of limit)
              <input class="input" type="number" name="alert_threshold" min="1" max="100" step="1" required />
            </label>
            <button type="submit" class="btn btn-primary span-all">Save goal</button>
          </form>
          <div class="streak-tile">
            <span class="kpi-label">Current streak</span>
            <span class="kpi-value" id="goalStreak">–</span>
            <span class="kpi-label">weeks under budget</span>
          </div>
        </div>
        <p id="goalStatus" class="status-message" role="status"></p>
      </section>
    </main>

    <div class="chart-tooltip" id="tooltip" role="tooltip" hidden></div>

    <nav class="app-nav" aria-label="Main">
      <ul>
        <li>
          <a href="../Transactions/transactions.html">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2zM9 7h6M9 11h6M9 15h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /></svg>
            Transactions
          </a>
        </li>
        <li>
          <a href="../Analytics/analytics.html" aria-current="page">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            Analytics
          </a>
        </li>
        <li>
          <a href="../Resources/resources.html">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></svg>
            Resources
          </a>
        </li>
        <li>
          <a href="../About/about.html">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M12 11v6M12 7.5v.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
            About
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
