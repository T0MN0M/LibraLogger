<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration | Libra Logger</title>
    <link rel="stylesheet" href="registration.css" />
    <script src="registration.js" defer></script>
  </head>
  <body>
    <!-- Black background with moving stars -->
    <canvas id="stars"></canvas>

    <div class="brand">Libra <span>Logger</span></div>

    <main class="card">
      <img class="logo-placeholder logo-image" src="../../Styles/LibraLoggerLogo.png" alt="Libra Logger logo" aria-label="Libra Logger logo" />

      <h1>Registration Page</h1>
      <hr class="title-rule" />

      <form id="registerForm" novalidate>
        <div class="row">
          <input type="text" id="firstName" name="firstName" placeholder="First name" autocomplete="given-name" required />
          <input type="text" id="lastName" name="lastName" placeholder="Last name" autocomplete="family-name" required />
        </div>

        <input type="email" id="email" name="email" placeholder="Email address" autocomplete="email" required />

        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" minlength="8" required />
          <button type="button" id="togglePassword" class="eye-btn" aria-label="Show password" title="Show password">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="none" stroke="currentColor" stroke-width="2" />
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
        </div>

        <fieldset class="dob">
          <legend>Date of birth</legend>
          <input type="text" id="dobMonth" name="dobMonth" placeholder="MM" inputmode="numeric" maxlength="2" required />
          <input type="text" id="dobDay" name="dobDay" placeholder="DD" inputmode="numeric" maxlength="2" required />
          <input type="text" id="dobYear" name="dobYear" placeholder="YYYY" inputmode="numeric" maxlength="4" required />
        </fieldset>

        <p id="formMessage" class="form-message" role="alert"></p>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button type="button" id="googleSignUp" class="btn btn-google">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z" />
          <path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z" />
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z" />
        </svg>
        Sign up with Google
      </button>

      <p class="switch-link">Already have an account? <a href="../Login_Page/login.html">Log in</a></p>
    </main>
  </body>
</html>
