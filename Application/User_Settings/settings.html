<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Libra Logger</title>
    <link rel="stylesheet" href="settings.css" />
    <script src="settings.js" defer></script>
  </head>
  <body>
    <!-- Black background with moving stars -->
    <canvas id="stars"></canvas>

    <div class="brand">Libra <span>Logger</span></div>

    <main class="card">
      <!-- Header: back arrow, title, gear -->
      <header class="settings-header">
        <a class="back-btn" href="../Dashboard/dashboard.html" aria-label="Back to dashboard" title="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M20 12H5M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Back</span>
        </a>
        <h1>Settings</h1>
        <svg class="gear" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </header>
      <hr class="title-rule" />

      <!-- Profile picture -->
      <section class="pfp-section">
        <div class="pfp" aria-label="Profile picture">
          <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
            <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
        <button type="button" class="pfp-change" data-action="Change profile picture">change PFP</button>
      </section>

      <!-- Account fields -->
      <dl class="fields">
        <div class="field">
          <dt>Name</dt>
          <dd>Test User 01</dd>
          <button type="button" class="edit-btn" data-action="Change name" aria-label="Change name" title="Change name">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
          </button>
        </div>
        <div class="field">
          <dt>Email</dt>
          <dd>example@gmail.com</dd>
          <button type="button" class="edit-btn" data-action="Change email" aria-label="Change email" title="Change email">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
          </button>
        </div>
        <div class="field">
          <dt>Password</dt>
          <dd class="masked">********</dd>
          <button type="button" class="edit-btn" data-action="Change password" aria-label="Change password" title="Change password">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
          </button>
        </div>
        <div class="field">
          <dt>Nickname</dt>
          <dd class="empty">[add nickname]</dd>
          <button type="button" class="edit-btn" data-action="Add nickname" aria-label="Add nickname" title="Add nickname">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
          </button>
        </div>
      </dl>

      <!-- Options -->
      <h2 class="section-title">Options</h2>
      <div class="options">
        <button type="button" id="enable2fa" class="btn btn-2fa">Enable 2FA</button>
        <button type="button" class="btn btn-danger" data-action="Delete account">! Delete Account !</button>
      </div>

      <p id="statusMessage" class="status-message" role="status"></p>

      <footer class="card-footer"><span>Libra Logger</span></footer>
    </main>

    <!-- Libra logo, bottom-right corner -->
    <img class="corner-logo" src="../../Styles/LibraLoggerLogo.png" alt="Libra Logger logo" />

    <!-- 2FA confirmation popup -->
    <div id="twofaModal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="twofaTitle" aria-describedby="twofaDesc">
        <button type="button" id="closeModal" class="close-btn" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
        </button>
        <h2 id="twofaTitle">Confirm 2FA</h2>
        <hr class="title-rule" />
        <p id="twofaDesc">
          You are about to enable Two-Factor Authentication. After clicking
          <strong>YES</strong>, an email will be sent to test that 2FA is working.
        </p>
        <button type="button" id="confirm2fa" class="btn btn-primary">Yes</button>
      </div>
    </div>
  </body>
</html>
