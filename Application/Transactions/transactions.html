<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | Libra Logger</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="transactions.css" />
    <script src="../shared/stars.js" defer></script>
    <script src="../shared/api.js" defer></script>
    <script src="../shared/app-shell.js" defer></script>
    <script src="transactions.js" defer></script>
  </head>
  <body>
    <canvas id="stars"></canvas>

    <header class="topbar">
      <a class="topbar-btn logout" href="../Login_Page/login.html" data-logout title="Log out">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span class="label">Logout</span>
      </a>
      <a class="brand" href="../Dashboard/dashboard.html" title="Dashboard">
        <img src="../../Styles/LibraLoggerLogo.png" alt="" />
        Libra <span>Logger</span>
      </a>
      <a class="topbar-btn settings" href="../User_Settings/settings.html" title="Settings">
        <span class="label">Settings</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" /></svg>
      </a>
    </header>

    <main class="page">
      <div class="page-header">
        <h1 class="page-title">Transactions</h1>
        <p class="page-subtitle">Log purchases, upload receipts, and review your history.</p>
      </div>

      <div class="tx-layout">
        <!-- ===== Add transaction (Purchase.add_Transaction) ===== -->
        <section class="card" id="add" aria-labelledby="addTitle">
          <h2 class="card-title" id="addTitle">Add Transaction</h2>
          <form id="addForm" class="form-grid" novalidate>
            <label class="form-field full">
              Name
              <input class="input" name="name" required maxlength="100" placeholder="e.g. Chick-fil-A" />
            </label>
            <label class="form-field">
              Amount ($)
              <input class="input" name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00" />
            </label>
            <label class="form-field">
              Date
              <input class="input" name="date" type="date" required />
            </label>
            <label class="form-field full">
              Category
              <select class="input" name="category_ID" id="addCategory"></select>
            </label>
            <label class="form-field full">
              Description (optional)
              <textarea class="input" name="description" rows="2" maxlength="255"></textarea>
            </label>
            <label class="checkbox full">
              <input type="checkbox" name="recurring" /> Recurring (subscription)
            </label>
            <button type="submit" class="btn btn-primary span-all">Add</button>
          </form>
          <p id="addStatus" class="status-message" role="status"></p>

          <!-- ===== Upload receipt (Receipt.convert_To_Purchases) — sketch ===== -->
          <h2 class="card-title receipt-title">Upload Receipt</h2>
          <label class="dropzone" for="receiptInput">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span id="receiptLabel">Drop a receipt image or click to choose</span>
            <small>Receipt scanning will be connected with the backend.</small>
          </label>
          <input type="file" id="receiptInput" accept="image/*" hidden />
        </section>

        <!-- ===== History ===== -->
        <section class="card" aria-labelledby="historyTitle">
          <h2 class="card-title" id="historyTitle">
            History
            <button type="button" id="exportBtn" class="btn btn-ghost">Export CSV</button>
          </h2>

          <div class="filters">
            <input type="search" id="search" class="input" placeholder="Search transactions" aria-label="Search transactions" />
            <select id="filterCategory" class="input" aria-label="Filter by category">
              <option value="">All categories</option>
            </select>
          </div>

          <div class="table-wrap">
            <table class="tx-table">
              <thead>
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col">Name</th>
                  <th scope="col">Category</th>
                  <th scope="col" class="num">Amount</th>
                  <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
              </thead>
              <tbody id="txBody"></tbody>
            </table>
          </div>
          <p class="table-summary" id="tableSummary"></p>
        </section>
      </div>
    </main>

    <nav class="app-nav" aria-label="Main">
      <ul>
        <li>
          <a href="../Dashboard/dashboard.html">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /></svg>
            Home
          </a>
        </li>
        <li>
          <a href="../Transactions/transactions.html" aria-current="page">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2zM9 7h6M9 11h6M9 15h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /></svg>
            Transactions
          </a>
        </li>
        <li>
          <a href="../Analytics/analytics.html">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            Analytics
          </a>
        </li>
        <li>
          <a href="../Resources/resources.html">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /></svg>
            Resources
          </a>
        </li>
        <li>
          <a href="../About/about.html">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M12 11v6M12 7.5v.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
            About
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
